[project]
name = "ap-backend"
version = "0.1.0"
description = "Accounts payable document API: intake, schema validation, and three-way match."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pypdfium2>=5.14.0",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "reportlab>=5.0.1",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
